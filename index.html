<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5F3FA"><title>오늘의 발견</title><style>:root{--bg:#F5F3FA;--surface:#fff;--text:#222126;--muted:#77727F;--primary:#6757D9;--accent:#C7FF4A;--line:#DED9EC;--chip:#E8E3FB;--hero1:#B9AEFF;--hero2:#7462DE}body[data-theme=dark]{--bg:#161319;--surface:#221D26;--text:#F7F3F7;--muted:#AAA1AD;--primary:#D9529C;--accent:#8C7BFF;--line:#332B38;--chip:#302433;--hero1:#8C7BFF;--hero2:#D9529C}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:82px}.top{padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}.brand{font-size:30px;font-weight:900}.sub{color:var(--muted);margin-top:6px}.theme{position:fixed;right:14px;top:14px;z-index:10;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);padding:9px 12px;font-weight:800}.section{padding:18px}.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-radius:24px;padding:22px;min-height:200px;display:flex;flex-direction:column;justify-content:end;color:white}.hero h1{margin:8px 0 4px}.row{display:flex;gap:12px;overflow:auto}.card{min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}.thumb{height:140px;background:var(--chip);display:grid;place-items:center;font-size:48px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.title{font-weight:800}.meta{color:var(--muted);font-size:13px;line-height:1.5;margin-top:6px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--chip);padding:5px 8px;border-radius:999px;font-size:12px}.heart{float:right;border:0;background:none;color:var(--primary);font-size:22px}.screen{display:none}.screen.active{display:block}.search{margin:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}.list{padding:0 18px 18px}.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.tabs{display:flex;gap:8px;padding:16px 18px}.tabs button{flex:1;border:0;background:var(--chip);color:var(--text);padding:10px;border-radius:12px}.tabs button.active{background:var(--primary);color:white}.setting{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 18px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:10px}nav button{border:0;background:none;color:var(--muted);font-size:12px}nav button.active{color:var(--primary);font-weight:800}.err{margin:18px;padding:14px;border:1px solid #efb5b5;background:#fff0f0;color:#a22;border-radius:14px}.empty{color:var(--muted);padding:30px;text-align:center}.onboard{padding:28px 18px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 12px;border-radius:999px}.choice.sel{background:var(--primary);color:white}.primary{width:100%;border:0;background:var(--primary);color:white;padding:14px;border-radius:14px;font-weight:800;margin-top:22px}</style></head><body data-theme="light"><button class="theme" id="themeBtn" onclick="toggleTheme()">☾ 다크</button><div class="app"><section id="onboarding" class="screen active onboard"><div class="sub">오늘의 발견</div><h1>당신의 취향을<br>먼저 알려주세요.</h1><p class="sub">관심사를 선택하면 새로운 문화 행사를 취향에 맞게 보여드려요.</p><h2>관심사</h2><div class="choices" id="interestChoices"></div><h2>관심 지역</h2><div class="choices"><button class="choice sel">서울특별시</button><button class="choice">경기도</button><button class="choice">부산광역시</button></div><button class="primary" onclick="startApp()">시작하기</button></section><section id="home" class="screen"><div class="top"><div class="brand">오늘의 발견</div><div class="sub">이번 주, 새로운 곳을 만나보세요</div></div><div id="error"></div><div class="section" id="hero"></div><div class="section"><h2>새로 발견했어요</h2><div class="row" id="newCards"></div></div><div class="section"><h2>곧 끝나요</h2><div class="row" id="endingCards"></div></div><div class="section"><h2>취향에 맞을 것 같아요</h2><div class="row" id="tasteCards"></div></div></section><section id="search" class="screen"><div class="top"><div class="brand">검색</div><div class="sub">행사와 브랜드를 찾아보세요</div></div><div class="search"><input id="q" placeholder="행사, 브랜드를 검색해보세요" oninput="renderSearch()"></div><div class="list" id="searchList"></div></section><section id="favorites" class="screen"><div class="top"><div class="brand">관심 행사</div><div class="sub">저장한 행사를 한눈에 모아보세요</div></div><div class="tabs"><button class="active" onclick="favTab(this,'ongoing')">진행 중</button><button onclick="favTab(this,'upcoming')">예정</button><button onclick="favTab(this,'ended')">종료</button></div><div class="list" id="favList"></div></section><section id="settings" class="screen"><div class="top"><div class="brand">설정</div><div class="sub">취향과 앱 정보를 관리하세요</div></div><div class="setting"><b>관심사</b><div class="sub">초기 버전은 기기 로컬 저장</div></div><div class="setting"><b>데이터</b><div class="sub">Supabase approved 행사만 노출</div></div><div class="setting"><b>테마</b><div class="sub">Light: Digital Lavender · Dark: Berry Night</div></div></section><nav id="nav" style="display:none"><button class="active" onclick="go('home',this)">⌂<br>홈</button><button onclick="go('search',this)">⌕<br>검색</button><button onclick="go('favorites',this)">♡<br>관심</button><button onclick="go('settings',this)">⚙<br>설정</button></nav></div><script>const URL='https://qlztltxlpggeglvyldxq.supabase.co',KEY='sb_publishable_Sapr86ALXzwqx8owzdLArg_sycwHDf-';const interests=['패션','뷰티','캐릭터','애니메이션','게임','영화','미술','사진','음악','음식','디저트','주류','스포츠','인테리어'];document.getElementById('interestChoices').innerHTML=interests.map((x,i)=>`<button class="choice ${[2,8,10].includes(i)?'sel':''}" onclick="this.classList.toggle('sel')">${x}</button>`).join('');let events=[],favorites=JSON.parse(localStorage.getItem('favEvents')||'[]');function fmt(s){if(!s)return'';let d=new Date(s+'T00:00:00');return`${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}function period(e){return e.start_date&&e.end_date?`${fmt(e.start_date)} - ${fmt(e.end_date)}`:(e.start_date?fmt(e.start_date):'일정 확인')}function region(e){return [e.sido,e.sigungu].filter(Boolean).join(' · ')||e.venue_name||'장소 확인'}function tags(e){return Array.isArray(e.interests)?e.interests:[]}function status(e){let t=new Date();t.setHours(0,0,0,0);let s=e.start_date?new Date(e.start_date+'T00:00:00'):null,en=e.end_date?new Date(e.end_date+'T23:59:59'):null;if(s&&s>t)return'upcoming';if(en&&en<t)return'ended';return'ongoing'}function image(e){return e.image_url?`<img src="${e.image_url}" onerror="this.remove();this.parentElement.textContent='✨'">`:'✨'}function card(e){return`<div class="card"><div class="thumb">${image(e)}</div><div class="body"><button class="heart" onclick="toggleFav(${e.id});renderAll()">${favorites.includes(e.id)?'♥':'♡'}</button><div class="title">${e.title}</div><div class="meta">${period(e)}<br>${region(e)}</div><div class="chips">${tags(e).map(t=>`<span class="chip">#${t}</span>`).join('')}</div></div></div>`}function item(e){return`<div class="item"><div class="title">${e.title}</div><div class="meta">${period(e)} · ${region(e)}</div></div>`}async function load(){try{let r=await fetch(`${URL}/rest/v1/events?status=eq.approved&select=*&order=created_at.desc`,{headers:{apikey:KEY}});if(!r.ok)throw new Error('HTTP '+r.status);events=await r.json();renderAll()}catch(e){document.getElementById('error').innerHTML=`<div class="err"><b>DB 연결 실패</b><br>${e.message}</div>`;renderAll()}}function startApp(){document.getElementById('onboarding').classList.remove('active');document.getElementById('home').classList.add('active');document.getElementById('nav').style.display='grid';load()}function go(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='favorites')renderFavs()}function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('favEvents',JSON.stringify(favorites))}function renderSearch(){let q=(document.getElementById('q').value||'').toLowerCase();let xs=events.filter(e=>[e.title,e.organizer_name,e.summary,e.event_type,...tags(e)].filter(Boolean).join(' ').toLowerCase().includes(q));document.getElementById('searchList').innerHTML=xs.length?xs.map(item).join(''):'<div class="empty">검색 결과가 없어요.</div>'}function renderFavs(st='ongoing'){let xs=events.filter(e=>favorites.includes(e.id)&&status(e)===st);document.getElementById('favList').innerHTML=xs.length?xs.map(item).join(''):'<div class="empty">저장한 행사가 없어요.</div>'}function favTab(b,st){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderFavs(st)}function renderAll(){let hero=events.find(e=>status(e)!=='ended')||events[0];document.getElementById('hero').innerHTML=hero?`<div class="hero"><small>이번 주 추천</small><h1>${hero.title}</h1><div>${period(hero)} · ${region(hero)}</div></div>`:'<div class="empty">승인된 행사가 아직 없어요.</div>';document.getElementById('newCards').innerHTML=events.length?events.slice(0,6).map(card).join(''):'<div class="empty">행사가 없어요.</div>';let ending=events.filter(e=>status(e)==='ongoing').sort((a,b)=>(a.end_date||'9999').localeCompare(b.end_date||'9999'));document.getElementById('endingCards').innerHTML=ending.length?ending.slice(0,6).map(card).join(''):'<div class="empty">진행 중인 행사가 없어요.</div>';document.getElementById('tasteCards').innerHTML=events.length?events.slice(0,6).map(card).join(''):'<div class="empty">추천할 행사가 없어요.</div>';renderSearch();renderFavs()}function toggleTheme(){let d=document.body.getAttribute('data-theme')==='dark';document.body.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'☾ 다크':'☀ 라이트'};</script></body></html>
